[workspace]
authors = ["xiaoyao9184 <6614349+xiaoyao9184@users.noreply.github.com>"]
channels = ["conda-forge","nvidia"]
name = "reverse-from-synthid"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
link-gradio = "bash scripts/link-gradio.sh --mode link space/"

[dependencies]
python = ">=3.10"
gradio = ">=6.22.0,<7"

[pypi-dependencies]
numpy = ">=1.21.0"
scipy = ">=1.7.0"
opencv-python = ">=4.5.0"
PyWavelets = ">=1.1.1"
scikit-learn = ">=0.24.0"
Pillow = ">=8.0.0"
matplotlib = ">=3.4.0"
tqdm = ">=4.60.0"
torch = ">=2.0.0"
diffusers = ">=0.20.0"
safetensors = ">=0.3.0"
accelerate = ">=0.20.0"
google-genai = ">=1.0.0"
python-dotenv = ">=1.0.0"

spaces = ">=0.51.0"


[feature.cpu]
platforms = ["linux-64"]

[feature.cpu.dependencies]
pytorch-cpu = "*"


[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.system-requirements]
cuda = "12.0"

[feature.cuda.dependencies]
cuda-version = ">=12.9,<13"
pytorch-gpu = "*"


[feature.space]
platforms = ["linux-64"]

[feature.space.dependencies]
python = "==3.12"
pytorch = "==2.11.0"

[feature.space.pypi-dependencies]
GitPython = "==3.1.43"


[feature.studio]
platforms = ["linux-64"]

[feature.studio.dependencies]
python = "==3.12"
pytorch = "==2.10.0"

[feature.studio.pypi-dependencies]
GitPython = "==3.1.43"


[environments]
cuda = ["cuda"]
cpu = ["cpu"]
default = ["cuda"]
space = ["space"]
studio = ["studio"]
